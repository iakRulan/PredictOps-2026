<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工业智能体门户 · PredictOps Agent Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1018'/%3E%3Cpath d='M8 20l6-9 4 6 3-4 3 7' stroke='%2322d3ee' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/core.css" />
</head>
<body>
<div class="portal-wrap">
  <header class="portal-hero">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-9 4 6 3-4 3 7"/><circle cx="8" cy="8" r="1.3" fill="#22d3ee" stroke="none"/></svg>
    </div>
    <div class="portal-hero-text">
      <h1>工业智能体门户 <span>PredictOps Agent Portal</span></h1>
      <p>8 个独立部署的工业智能体应用 · 点击进入对应领域工作台</p>
    </div>
    <div class="portal-hero-right">
      <span class="pill pill-info"><span class="dot pulse"></span>集群在线</span>
      <span class="mono" id="clock" style="color:var(--txt-1);font-size:12.5px">--:--:--</span>
    </div>
  </header>

  <div class="portal-grid" id="portal-grid"><!-- 由 app.js 渲染 --></div>

  <footer class="portal-foot">
    <span>工业智能体门户 v1.0.0 · 8 个独立应用 · 端口 8081 ~ 8088</span>
    <span id="portal-host" class="mono"></span>
  </footer>
</div>
<script src="assets/app.js"></script>
</body>
</html>
